# XcodeGen 工程定义 —— 无 Mac 开发的核心。
# .xcodeproj 由本文件生成，不提交、不手改；要改工程结构就改这里。
# CI 上执行 `xcodegen generate` 现生成；本地也可用（需装 xcodegen，Windows 上不可用，交给 CI）。
#
# 改项目名：把 MyApp / com.example.myapp 全局替换即可。

name: MyApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"          # iOS 15 是 Xcode 26 支持的下限，不能再低
  createIntermediateGroups: true

packages:
  Core:
    path: Core           # 纯逻辑 Swift Package，Windows 上可本地 swift test

settings:
  base:
    SWIFT_VERSION: "5.0"              # 5.0 语言模式，避开 Swift 6 严格并发检查
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Core
        product: Core
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 计算器
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}                   # iOS 14+ 必须有，否则以兼容模式拉伸显示
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        TARGETED_DEVICE_FAMILY: "1"
        # TrollStore 路线全程不签名，这里直接关掉，避免 CI 上找证书
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
        MyAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyAppTests
