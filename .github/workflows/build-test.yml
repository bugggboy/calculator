# 等级 1：Build & Test —— 编译 + 跑测试 + 出报告。
# 入口文件很薄，真正的逻辑在中央仓库的 workflow 里，用提交 SHA 固定版本（不要改成 @main）。
name: Build & Test

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      suite:
        description: 跑哪些测试（fast 快线 / ui 慢线 / full 全部）
        type: choice
        options: [fast, ui, full]
        default: fast
      record_snapshots:
        description: 重新录制快照参考图（有意改了界面时勾选）
        type: boolean
        default: false

permissions:
  contents: write   # 录制快照后提交参考图需要；不用就改成 read

concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/build-test.yml@df71d6096d6d39ea799179cb2635703548b07ae0 # v1.1.0
    with:
      suite: ${{ inputs.suite || '' }}
      record_snapshots: ${{ inputs.record_snapshots || false }}
