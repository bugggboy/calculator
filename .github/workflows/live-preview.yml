# 等级 3：Live Preview —— 在手机浏览器里操作云端模拟器。
# 这是没有 Mac 时唯一能「看见」界面的手段，但它只是给人看的，不是测试。
#
# 使用前提：仓库 Secrets 里加 AGENT_PREVIEW_PASSWORD（≥12 位）。
# 若要用固定隧道，再加 AGENT_PREVIEW_TUNNEL_TOKEN，否则留空即可。
name: Live Preview

on:
  workflow_dispatch:
    inputs:
      preview_minutes:
        description: 预览开多久（1-20 分钟）
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: live-preview
  cancel-in-progress: true

jobs:
  preview:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/live-preview.yml@df71d6096d6d39ea799179cb2635703548b07ae0 # v1.1.0
    with:
      preview_minutes: ${{ inputs.preview_minutes }}
    secrets:
      AGENT_PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
      AGENT_PREVIEW_TUNNEL_TOKEN: ${{ secrets.AGENT_PREVIEW_TUNNEL_TOKEN }}
